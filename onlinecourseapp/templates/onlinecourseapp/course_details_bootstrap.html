<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ course.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">OnlineCourse</a>
    </div>
</nav>

<main class="container py-5">
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h1 class="card-title">{{ course.name }}</h1>
            <p class="card-text">{{ course.description }}</p>
        </div>
    </div>

    <h2 class="h4 mb-3">Course Lessons</h2>
    {% for lesson in course.lessons.all %}
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h3 class="h5">{{ lesson.order }}. {{ lesson.title }}</h3>
                <p class="card-text">{{ lesson.content }}</p>
            </div>
        </div>
    {% empty %}
        <div class="alert alert-info">No lessons have been added yet.</div>
    {% endfor %}

    <a class="btn btn-primary"
       href="{% url 'submit' course.id %}">Start Examination</a>
    <a class="btn btn-outline-secondary" href="{% url 'home' %}">
        Back to Courses
    </a>
</main>
</body>
</html>
